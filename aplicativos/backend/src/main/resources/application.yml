spring:
  application:
    name: trilha-aprovacao
  datasource:
    url: ${URL_BANCO:jdbc:postgresql://localhost:${PORTA_POSTGRESQL:5432}/${NOME_BANCO:trilha_aprovacao}}
    username: ${USUARIO_BANCO:trilha_aprovacao}
    password: ${SENHA_BANCO:altere_esta_senha_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${LIMITE_DO_ARQUIVO_DO_EDITAL:10MB}
      max-request-size: ${LIMITE_DA_REQUISICAO_DO_EDITAL:11MB}

springdoc:
  api-docs:
    enabled: ${OPENAPI_HABILITADA:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate.SQL: info
    org.springframework: info

server:
  port: ${PORTA_BACKEND:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

trilha:
  importacao-de-edital:
    limite-em-bytes: ${LIMITE_EM_BYTES_DO_EDITAL:10485760}
    limite-de-paginas: ${LIMITE_DE_PAGINAS_DO_EDITAL:500}
    limite-de-caracteres-extraidos: ${LIMITE_DE_CARACTERES_EXTRAIDOS_DO_EDITAL:2000000}
    retencao-do-conteudo: ${RETENCAO_DO_CONTEUDO_DO_EDITAL:P30D}
    timeout-da-extracao: ${TIMEOUT_DA_EXTRACAO_DO_EDITAL:PT30S}
    intervalo-da-limpeza: ${INTERVALO_DA_LIMPEZA_DO_EDITAL:PT1H}
    interpretacao-assistida:
      habilitada: ${INTERPRETACAO_ASSISTIDA_DO_EDITAL_HABILITADA:false}
      provedor: ${PROVEDOR_DA_INTERPRETACAO_DO_EDITAL:responses-api}
      url-base: ${URL_DA_API_OPENAI:https://api.openai.com/v1}
      chave-da-api: ${CHAVE_DA_API_OPENAI_PARA_EDITAIS:}
      modelo: ${MODELO_DA_INTERPRETACAO_DO_EDITAL:gpt-5.6-sol}
      timeout: ${TIMEOUT_DA_INTERPRETACAO_DO_EDITAL:PT180S}
      executavel-do-codex: ${EXECUTAVEL_DO_CODEX:}
      codex-home: ${CODEX_HOME:}
      limite-de-paginas-renderizadas: ${LIMITE_DE_PAGINAS_RENDERIZADAS_PELA_IA:20}
      dpi-da-renderizacao: ${DPI_DA_RENDERIZACAO_PARA_IA:144}
  automacao:
    habilitada: ${ASSISTENTE_TELEGRAM_HABILITADO:false}
    identificador-do-bot: ${IDENTIFICADOR_DO_BOT_TELEGRAM:0}
    segredo-de-hash: ${SEGREDO_DE_HASH_DA_AUTOMACAO:}
    identificador-da-chave-do-gateway: ${IDENTIFICADOR_DA_CHAVE_DO_GATEWAY_OPENCLAW:gateway-openclaw}
    segredo-do-gateway: ${SEGREDO_DO_GATEWAY_OPENCLAW:}
    tolerancia-do-gateway: ${TOLERANCIA_DO_GATEWAY_OPENCLAW:PT2M}
    limite-do-gateway-por-minuto: ${LIMITE_DO_GATEWAY_POR_MINUTO:60}
    limite-do-corpo-do-gateway: ${LIMITE_DO_CORPO_DO_GATEWAY:65536}
    retencao-de-nonces: ${RETENCAO_DE_NONCES_DO_GATEWAY:PT168H}
    validade-do-codigo: ${VALIDADE_DO_CODIGO_DO_TELEGRAM:PT10M}
    validade-da-credencial: ${VALIDADE_DA_CREDENCIAL_MCP:P90D}
    mcp:
      origens-permitidas: ${ORIGENS_PERMITIDAS_NO_MCP:http://localhost:5173,http://127.0.0.1:5173}
      hosts-permitidos: ${HOSTS_PERMITIDOS_NO_MCP:localhost:*,127.0.0.1:*,backend:8080,host.docker.internal:8080}
