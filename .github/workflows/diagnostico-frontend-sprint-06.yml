name: Diagnostico frontend Sprint 06

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  frontend:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-06'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - name: Instalar
        working-directory: aplicativos/frontend
        run: npm ci
      - name: Tipos
        working-directory: aplicativos/frontend
        run: npm run verificar-tipos
      - name: Lint
        working-directory: aplicativos/frontend
        run: npm run lint
      - name: Testes
        working-directory: aplicativos/frontend
        run: npm run test
      - name: Build
        working-directory: aplicativos/frontend
        run: npm run build
      - name: Formatacao
        working-directory: aplicativos/frontend
        run: npm run verificar-formatacao
      - name: Auditoria
        working-directory: aplicativos/frontend
        run: npm audit --audit-level=low
