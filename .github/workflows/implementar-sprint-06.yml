          caminho = Path('aplicativos/backend/src/main/java/br/com/trilhaaprovacao/planejamento/aplicacao/ServicoDePlanejamento.java')
          texto = caminho.read_text()
          texto = texto.replace('import br.com.trilhaaprovacao.conteudos.dominio.TopicoDaMateria;\n', 'import br.com.trilhaaprovacao.conteudos.dominio.TopicoDaMateria;\nimport br.com.trilhaaprovacao.estudos.aplicacao.ServicoDeMateriaisEEstudos;\nimport br.com.trilhaaprovacao.estudos.dominio.RegistroDeEstudo;\n')
