          texto = texto.replace('        this.topicos = topicos;\n    }', '        this.topicos = topicos;\n        this.estudos = estudos;\n    }', 1)
          inicio = texto.index('    @Transactional\n    public ResultadoDaExecucaoDoBloco concluirBloco')
          fim = texto.index('    private void validarConjuntoDeDias', inicio)
          novo = '''    @Transactional
              public ResultadoDaExecucaoDoBloco concluirBloco(UUID usuario, UUID bloco,
                      int duracao, String observacao, UUID identificadorDoTopico) {
                  return finalizarBloco(usuario, bloco, ResultadoDaExecucao.CONCLUIDO,
