name: Diagnosticar Frontend Sprint 07

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  frontend:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-07'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - name: Capturar testes
        working-directory: aplicativos/frontend
        run: |
          npm ci
          npm run test > /tmp/frontend.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: diagnostico-frontend-sprint-07
          path: /tmp/frontend.log
