name: Ajustes temporarios

on:
  pull_request:

permissions:
  contents: write

jobs:
  ajustar:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/planejamento-sprint-05
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - working-directory: aplicativos/frontend
        run: npm ci
      - working-directory: aplicativos/frontend
        run: npm run formatar
      - name: Ajustar limpeza dos testes de planejamento
        run: |
          python - <<'PY'
          from pathlib import Path
          arquivo = Path('aplicativos/backend/src/test/java/br/com/trilhaaprovacao/planejamento/api/PlanejamentoIntegracaoTest.java')
          texto = arquivo.read_text()
          texto = texto.replace(
              'TRUNCATE TABLE blocos_de_estudo, disponibilidades_do_dia, planos_semanais,',
              'TRUNCATE TABLE execucoes_de_bloco, blocos_de_estudo, disponibilidades_do_dia, planos_semanais,',
          )
          arquivo.write_text(texto)
          PY
      - name: Versionar ajustes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aplicativos/frontend/src/modulos/planejamento/PlanejamentoHojePagina.vue
          git add aplicativos/frontend/src/modulos/planejamento/PlanejamentoHojePagina.spec.ts
          git add aplicativos/frontend/src/modulos/planejamento/apiDePlanejamento.ts
          git add aplicativos/backend/src/test/java/br/com/trilhaaprovacao/planejamento/api/PlanejamentoIntegracaoTest.java
          if ! git diff --cached --quiet; then
            git commit -m "chore: aplica formatacao e ajusta testes da sprint 05"
            git push origin HEAD:feature/planejamento-sprint-05
          fi
