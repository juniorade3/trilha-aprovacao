name: Diagnostico temporario

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - working-directory: aplicativos/frontend
        run: npm ci
      - working-directory: aplicativos/frontend
        run: npm run formatar
      - uses: actions/upload-artifact@v6
        with:
          name: formatacao
          path: |
            aplicativos/frontend/src/modulos/planejamento/PlanejamentoHojePagina.vue
            aplicativos/frontend/src/modulos/planejamento/PlanejamentoHojePagina.spec.ts
            aplicativos/frontend/src/modulos/planejamento/apiDePlanejamento.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Incluir execucoes na limpeza dos testes
        run: |
          python - <<'PY'
          from pathlib import Path
          arquivo = Path('aplicativos/backend/src/test/java/br/com/trilhaaprovacao/planejamento/api/PlanejamentoIntegracaoTest.java')
          texto = arquivo.read_text()
          texto = texto.replace(
              'TRUNCATE TABLE blocos_de_estudo, disponibilidades_do_dia, planos_semanais,',
              'TRUNCATE TABLE execucoes_de_bloco, blocos_de_estudo, disponibilidades_do_dia, planos_semanais,',
          )
          arquivo.write_text(texto)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: aplicativos/backend/pom.xml
      - name: Executar e registrar
        working-directory: aplicativos/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify > backend.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: diagnostico-backend
          path: |
            aplicativos/backend/backend.log
            aplicativos/backend/target/surefire-reports
            aplicativos/backend/src/test/java/br/com/trilhaaprovacao/planejamento/api/PlanejamentoIntegracaoTest.java
