name: Corrige limpeza dos testes da Sprint 05

on:
  push:
    branches: [feature/planejamento-sprint-05]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/planejamento-sprint-05
      - name: Incluir dependencias no truncate dos testes
        run: |
          python - <<'PY'
          from pathlib import Path

          raiz = Path('aplicativos/backend/src/test/java')
          alterados = 0
          for arquivo in raiz.rglob('*.java'):
              texto = arquivo.read_text()
              if 'TRUNCATE TABLE' not in texto or 'usuarios CASCADE' in texto:
                  continue
              novo = texto.replace('materias, usuarios\n', 'materias, usuarios CASCADE\n')
              if novo != texto:
                  arquivo.write_text(novo)
                  alterados += 1
          print(f'Arquivos de teste ajustados: {alterados}')
          PY
      - name: Remover workflow temporario e versionar
        run: |
          rm .github/workflows/formatacao-temporaria.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: ajusta limpeza do banco para execucoes de bloco"
          git push origin HEAD:feature/planejamento-sprint-05
