name: Formatacao temporaria

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - working-directory: aplicativos/frontend
        run: npm ci
      - working-directory: aplicativos/frontend
        run: npm run formatar
      - run: git diff --binary > formatacao.patch
      - uses: actions/upload-artifact@v6
        with:
          name: formatacao
          path: formatacao.patch
