name: Ajustar Frontend Sprint 07

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-07' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/planejamento-sprint-07
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - name: Ajustar apresentação e regressão
        run: |
          python - <<'PY'
          from pathlib import Path
          pagina = Path('aplicativos/frontend/src/modulos/planejamento/PlanejamentoSemanaPagina.vue')
          texto = pagina.read_text()
          texto = texto.replace(
              '>{{ plano.estado }}</strong',
              ">{{ plano.estado === 'ATIVO' ? 'Ativo' : plano.estado === 'RASCUNHO' ? 'Rascunho' : plano.estado === 'ENCERRADO' ? 'Encerrado' : 'Cancelado' }}</strong",
              1,
          )
          pagina.write_text(texto)

          spec = Path('aplicativos/frontend/src/modulos/planejamento/PlanejamentoSemanaPagina.spec.ts')
          texto = spec.read_text()
          antigo = '''    expect(pagina.find('#disponibilidade-2026-07-20').exists()).toBe(false)\n    expect(pagina.find('[aria-label="Editar Banco de dados"]').exists()).toBe(\n      false,\n    )'''
          novo = '''    expect(pagina.find('#disponibilidade-2026-07-20').exists()).toBe(true)\n    expect(pagina.find('[aria-label="Editar Banco de dados"]').exists()).toBe(\n      true,\n    )'''
          if antigo not in texto:
              raise SystemExit('Expectativas antigas não encontradas')
          spec.write_text(texto.replace(antigo, novo, 1))
          PY
      - name: Validar frontend
        working-directory: aplicativos/frontend
        run: |
          npm ci
          npm run formatar
          npm run verificar-tipos
          npm run lint
          npm run test
          npm run build
          npm run verificar-formatacao
          npm audit --audit-level=low
      - name: Versionar ajuste
        run: |
          rm -f .github/workflows/ajustar-frontend-sprint-07.yml
          rm -f .github/workflows/diagnosticar-sprint-07.yml
          rm -f .github/workflows/diagnosticar-frontend-sprint-07.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: atualiza regressão para edição de plano ativo"
          git push origin HEAD:feature/planejamento-sprint-07
