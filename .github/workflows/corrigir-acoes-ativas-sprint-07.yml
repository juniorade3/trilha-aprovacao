name: Corrigir Acoes Ativas Sprint 07

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-07' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/planejamento-sprint-07
      - name: Liberar ações planejadas no ativo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aplicativos/frontend/src/modulos/planejamento/PlanejamentoSemanaPagina.vue')
          t = p.read_text()
          antigo = '''                  v-if="plano.estado === 'RASCUNHO'"\n                  class="acoes-do-bloco-planejado"'''
          novo = '''                  v-if="\n                    (plano.estado === 'RASCUNHO' || plano.estado === 'ATIVO') &&\n                    bloco.estado === 'PLANEJADO'\n                  "\n                  class="acoes-do-bloco-planejado"'''
          if antigo not in t:
              raise SystemExit('Condição antiga não encontrada')
          p.write_text(t.replace(antigo, novo, 1))
          PY
      - name: Versionar
        run: |
          rm -f .github/workflows/corrigir-acoes-ativas-sprint-07.yml
          rm -f .github/workflows/diagnostico-final-sprint-07.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: libera edição de blocos planejados no plano ativo"
          git push origin HEAD:feature/planejamento-sprint-07
