name: Corrigir Sprint 07

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-07' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/planejamento-sprint-07
      - name: Corrigir variável capturada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aplicativos/backend/src/main/java/br/com/trilhaaprovacao/planejamento/aplicacao/ServicoDePlanejamento.java')
          t = p.read_text()
          antigo = '''        ExecucaoDoBloco corrigida = regra("EXECUCAO_DO_BLOCO_INVALIDA",\n                () -> atual.corrigir(resultado, duracao, observacao, novoRegistro, OffsetDateTime.now()));'''
          novo = '''        UUID registroCorrigido = novoRegistro;\n        ExecucaoDoBloco corrigida = regra("EXECUCAO_DO_BLOCO_INVALIDA",\n                () -> atual.corrigir(resultado, duracao, observacao,\n                        registroCorrigido, OffsetDateTime.now()));'''
          if antigo not in t:
              raise SystemExit('Trecho esperado não encontrado')
          p.write_text(t.replace(antigo, novo, 1))
          PY
      - name: Versionar correção
        run: |
          rm .github/workflows/corrigir-sprint-07.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrige compilação da correção de execução"
          git push origin HEAD:feature/planejamento-sprint-07
