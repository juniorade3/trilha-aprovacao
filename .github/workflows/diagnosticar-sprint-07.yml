name: Diagnosticar Sprint 07

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnostico:
    if: github.event.pull_request.head.ref == 'feature/planejamento-sprint-07'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: aplicativos/backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aplicativos/frontend/package-lock.json
      - name: Diagnosticar backend
        working-directory: aplicativos/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify > /tmp/backend.log 2>&1 || true
      - name: Diagnosticar frontend
        working-directory: aplicativos/frontend
        run: |
          npm ci
          npm run test > /tmp/frontend.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: diagnostico-sprint-07
          path: |
            /tmp/backend.log
            /tmp/frontend.log
