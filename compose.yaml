services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOME_BANCO:-trilha_aprovacao}
      POSTGRES_USER: ${USUARIO_BANCO:-trilha_aprovacao}
      POSTGRES_PASSWORD: ${SENHA_BANCO:-altere_esta_senha_local}
    ports:
      - "${PORTA_POSTGRESQL:-5432}:5432"
    volumes:
      - dados-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  dados-postgresql:
